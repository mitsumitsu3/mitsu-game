name: Cost guard

on:
  pull_request:
    paths:
      - 'infrastructure/cost-guard/**'
      - '.github/workflows/cost-guard.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/cost-guard/**'
      - '.github/workflows/cost-guard.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test shutdown decisions and partial failures
        run: python3 -m unittest discover -s infrastructure/cost-guard -p 'test_*.py' -v
      - name: Generate CloudFormation template
        run: python3 infrastructure/cost-guard/build_template.py > /tmp/cost-guard.json
